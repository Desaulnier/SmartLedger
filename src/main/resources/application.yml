  web:
    # 补充：跨域配置（前端调用接口必加，否则会报跨域错误）
    cors:
      allowed-origin-patterns: "*"  # 允许所有前端域名（开发环境推荐，生产可指定具体域名）
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS  # 允许的请求方式
      allowed-headers: "*"          # 允许所有请求头
      allow-credentials: true       # 允许携带Cookie（如登录凭证）
      max-age: 3600                 # 预检请求缓存时间（1小时，减少请求次数）
    resources:
      static-locations: classpath:/META-INF/resources/, classpath:/resources/, classpath:/static/, classpath:/public/, file:D:/Graduation Project/SmartLedger/file/
server:
  port: 8082

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    lu.smartledger.mapper: debug  # Mapper包下日志级别为debug（打印SQL）
    root: info  # 全局日志级别为info（避免日志过多）
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"  # 日志格式
file:
  upload-path: D:/GraduationProject/SmartLedger/uploads