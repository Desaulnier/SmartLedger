  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      resolve-lazily: true
    encoding:
      charset: utf-8
      force: true
      enabled: true
  mail:
    host: smtp.qq.com
    username: 2055346449@qq.com
    password: ztomwtlilxbodaab
    protocol: smtp
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          timeout: 5000  # 邮件发送超时时间（5秒）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
